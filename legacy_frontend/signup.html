<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — TravelPlanner</title>
  <meta name="description" content="Create your free TravelPlanner account and start planning smarter trips today." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { min-height:100vh; background:linear-gradient(135deg,var(--color-primary) 0%,#1a4fab 50%,#0e3266 100%); display:flex; flex-direction:column; }
    .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
    .auth-card  { background:#fff; border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); padding:2.75rem 2.5rem; width:100%; max-width:480px; }
    .auth-logo  { text-align:center; margin-bottom:2rem; }
    .auth-logo .logo-icon { width:56px; height:56px; background:linear-gradient(135deg,var(--color-primary),var(--color-accent)); border-radius:var(--radius-md); display:inline-flex; align-items:center; justify-content:center; font-size:1.5rem; color:#fff; margin-bottom:.75rem; }
    .auth-logo h2 { color:var(--color-primary); margin-bottom:.25rem; }
    .auth-logo p  { font-size:.87rem; }
    .divider { display:flex; align-items:center; gap:1rem; margin:1.25rem 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--color-border); }
    .divider span { font-size:.8rem; color:var(--color-text-muted); }
    .social-btn { display:flex; align-items:center; justify-content:center; gap:.6rem; width:100%; padding:.7rem; border:1.5px solid var(--color-border); border-radius:var(--radius-sm); font-size:.9rem; font-weight:600; transition:var(--transition); cursor:pointer; background:#fff; }
    .social-btn:hover { border-color:var(--color-accent); background:rgba(6,182,212,.04); }
    .auth-footer { text-align:center; margin-top:1.5rem; font-size:.87rem; color:var(--color-text-muted); }
    .auth-footer a { color:var(--color-primary); font-weight:600; }
    .strength-bar { height:4px; border-radius:4px; background:var(--color-border); margin-top:.4rem; overflow:hidden; }
    .strength-fill { height:100%; border-radius:4px; transition:width .3s, background .3s; width:0%; }
    .strength-text  { font-size:.75rem; margin-top:.25rem; }
    .password-wrap { position:relative; }
    .password-wrap .form-control { padding-right:3rem; }
    .toggle-pw { position:absolute; right:.85rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; color:var(--color-text-muted); }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">✈</div>
      <h2>Create Account</h2>
      <p>Start planning your dream journeys for free</p>
    </div>

    <div style="display:flex;gap:.75rem;margin-bottom:1rem">
      <button class="social-btn" onclick="alert('Google OAuth — [API-READY]')">🌐 Google</button>
      <button class="social-btn" onclick="alert('Facebook OAuth — [API-READY]')">📘 Facebook</button>
    </div>

    <div class="divider"><span>or sign up with email</span></div>

    <form id="signup-form" novalidate>
      <div class="form-row" style="margin-bottom:1.1rem">
        <div class="form-group" id="fg-fname">
          <label class="form-label" for="fname">First Name</label>
          <input class="form-control" type="text" id="fname" placeholder="Arjun" autocomplete="given-name" required />
          <span class="form-error" id="err-fname">Enter your first name</span>
        </div>
        <div class="form-group" id="fg-lname">
          <label class="form-label" for="lname">Last Name</label>
          <input class="form-control" type="text" id="lname" placeholder="Kumar" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:1.1rem" id="fg-semail">
        <label class="form-label" for="semail">Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon">📧</span>
          <input class="form-control" type="email" id="semail" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <span class="form-error" id="err-semail">Enter a valid email address</span>
      </div>

      <div class="form-group" style="margin-bottom:1.1rem" id="fg-spw">
        <label class="form-label" for="spw">Password</label>
        <div class="password-wrap">
          <input class="form-control" type="password" id="spw" placeholder="Create a strong password" autocomplete="new-password" oninput="checkStrength(this.value)" required />
          <button type="button" class="toggle-pw" onclick="togglePw('spw',this)">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-text" id="strength-text"></div>
        <span class="form-error" id="err-spw">Password must be at least 8 characters</span>
      </div>

      <div class="form-group" style="margin-bottom:1.75rem" id="fg-cpw">
        <label class="form-label" for="cpw">Confirm Password</label>
        <div class="password-wrap">
          <input class="form-control" type="password" id="cpw" placeholder="Repeat your password" autocomplete="new-password" required />
          <button type="button" class="toggle-pw" onclick="togglePw('cpw',this)">👁</button>
        </div>
        <span class="form-error" id="err-cpw">Passwords do not match</span>
      </div>

      <div style="margin-bottom:1.5rem;display:flex;align-items:flex-start;gap:.6rem">
        <input type="checkbox" id="terms" style="margin-top:.2rem;accent-color:var(--color-primary)" required />
        <label for="terms" style="font-size:.83rem;color:var(--color-text-muted)">
          I agree to the <a href="#" style="color:var(--color-primary);font-weight:600">Terms of Service</a> and
          <a href="#" style="color:var(--color-primary);font-weight:600">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="signup-btn">Create Account →</button>
    </form>

    <div class="auth-footer">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}
function checkStrength(pw) {
  const fill = document.getElementById('strength-fill');
  const text = document.getElementById('strength-text');
  let score = 0;
  if (pw.length >= 8)  score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const pct    = (score / 4) * 100;
  const colors = ['#ef4444','#F59E0B','#22c55e','#16a34a'];
  const labels = ['Weak','Fair','Strong','Very Strong'];
  fill.style.width      = pct + '%';
  fill.style.background = colors[score - 1] || 'var(--color-border)';
  text.textContent      = score ? labels[score - 1] : '';
  text.style.color      = colors[score - 1] || '';
}
</script>
</body>
</html>
